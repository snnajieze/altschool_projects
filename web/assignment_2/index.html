<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 2 Form Input Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f4f6fb;
            color: #1f2937;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
            padding: 28px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            text-align: center;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-top: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .invalid {
            border-color: #ef4444;
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.12);
        }

        .valid {
            border-color: #16a34a;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.12);
        }

        .message {
            margin-top: 4px;
            font-size: 0.95rem;
            color: #ef4444;
            min-height: 1.3rem;
        }

        .success {
            margin-top: 16px;
            color: #065f46;
            background: #d1fae5;
            border: 1px solid #10b981;
            padding: 12px 14px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #4338ca;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>User Registration</h1>
        <form id="registrationForm" novalidate>
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required />
            <div id="fullNameMessage" class="message"></div>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required />
            <div id="emailMessage" class="message"></div>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 characters" required />
            <div id="passwordMessage" class="message"></div>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password"
                required />
            <div id="confirmPasswordMessage" class="message"></div>

            <label for="age">Age</label>
            <input type="number" id="age" name="age" placeholder="18" min="0" required />
            <div id="ageMessage" class="message"></div>

            <button type="submit">Register</button>
            <div id="successMessage" class="success" style="display:none;"></div>
        </form>
    </div>

    <script src="script.js" defer></script>
</body>

</html>
