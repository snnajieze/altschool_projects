<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Grade Tracker</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="tracker">
        <h1>Student Grade Tracker</h1>

        <form id="studentForm" class="student-form">
            <div class="field-group">
                <label for="studentName">Student Name</label>
                <input type="text" id="studentName" name="studentName" placeholder="Enter name" />
            </div>
            <div class="field-group">
                <label for="studentGrade">Grade</label>
                <input type="number" id="studentGrade" name="studentGrade" placeholder="0 - 100" min="0" max="100" />
            </div>
            <button type="submit">Add Student</button>
        </form>

        <div id="errorMessage" class="message error" aria-live="polite"></div>

        <section class="results">
            <div class="summary">
                <h2>Average Grade</h2>
                <p id="averageGrade">No students yet</p>
            </div>
            <div class="list-card">
                <h2>Student List</h2>
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Grade</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
